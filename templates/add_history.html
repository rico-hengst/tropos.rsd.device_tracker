{% extends 'base.html' %}
{% block content %}
<style>
/* Override Bootstrap's placeholder styles */
.form-control::placeholder,
.form-select::placeholder,
textarea::placeholder,
input::placeholder {
  font-family: "Liberation Mono", monospace !important;
  font-size: 0.9em;
  color: blue !important;
  opacity: 0.4 !important;
}
</style>
    <div class="container">
        <div class="row py-3">
            <div class="col-12 borders srounded pt-3 mb-4">
                <h2>Add history</h2>

            </div>
            
            <div class="col-12 border  rounded p-3">
                <form method="get"     enctype = "multipart/form-data" action="{{ url_for('handle_add_history') }}">
                    
                    
                <div class="row">
                    <div class="col-3 p-1">
                        <div class="card">
                            <div class="card-header">
                                <b>General info</b>
                            </div>
                            <div class="card-body">
                                <div focus="exampleFormControlInput1"></div>
                        
                                <div class="mb-3">
                                    <label for="exampleFormControlInput1" class="form-label">Device name @ device tracker</label>
                                    <input name="metadata.name" class="form-control form-control-sm" id="exampleFormControlInput1" placeholder="e.g: hatpro_g123 | ms80_123" 
                                        pattern="[a-zA-Z\d_\-]*" title="Only [a-zA-Z\d_\-] are accepted" type="text" required>
                                </div>
                                
                                
                                <label class="form-label">Device class @ device tracker</label>
                                <select name="metadata.class0" class="form-select form-select-sm" aria-label="Small select example" required>
                                    <option value=""></option>
                                    {% for class0 in classes0 %}
                                        {% if not class0 in user.class_edit_roles %}
                                            <option value="" disabled>{{class0}} (no access right)</option>
                                        {% else %}
                                            <option value="{{class0}}">{{class0}}</option>
                                        {% endif %}
                                    {% endfor%}
                                </select>
                                
                                <div class="mb-3">
                                    <label for="exampleFormControlInput2" class="form-label">Device subclass @ device tracker</label>
                                    <input name="metadata.class1" class="form-control form-control-sm" id="exampleFormControlInput2" placeholder="e.g: hatpro | pyranometer" 
                                        pattern="[a-zA-Z\d_\-]*" title="Only [a-zA-Z\d_\-] are accepted" type="text" required>
                                </div>
                                
                                <div class="mb3">
                                    <label class="form-label" for="switchCheckDefault">Device is a platform (default=false)</label>
                                    <div class="form-check form-switch">
                                        <input name="metadata.is_platform" class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
                                    </div>
                                    
                                    
                                  
                                </div>
                                
                            </div>
                        </div>
                        
                    </div>
                    <div class="col-3 p-1">
                        <div class="card">
                            <div class="card-header">
                                <b>Device manufacturer</b>
                            </div>
                            <div class="card-body">
                        
                                <div class="mb-3">
                                    <label for="exampleFormControlInput3" class="form-label">Device manufacturer name</label>
                                    <input name="metadata.device_manufacturer.name" class="form-control form-control-sm" id="exampleFormControlInput3" placeholder="e.g: Radiometer Physics | EKO" 
                                         type="text" required>
                                </div>
                                <div class="mb-3">
                                    <label for="exampleFormControlInput4" class="form-label">Device manufacturer address</label>
                                    <input name="metadata.device_manufacturer.address" class="form-control form-control-sm" id="exampleFormControlInput4" placeholder="e.g: " 
                                         type="text" >
                                </div>
                                <div class="mb-3">
                                    <label for="exampleFormControlInput5" class="form-label">Device manufacturer contact</label>
                                    <input name="metadata.device_manufacturer.contact" class="form-control form-control-sm" id="exampleFormControlInput5" placeholder="e.g: email, telefon, url" 
                                         type="text" >
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-3 p-1">
                        <div class="card">
                            <div class="card-header">
                                <b>Device model</b>
                            </div>
                            <div class="card-body">
                        
                                <div class="mb-3">
                                    <label for="exampleFormControlInput6" class="form-label">Device model name</label>
                                    <input name="metadata.device_model.name" class="form-control form-control-sm" id="exampleFormControlInput6" placeholder="e.g: HATPRO-G5 | MS-80" 
                                         type="text" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="exampleFormControlInput7" class="form-label">Device model description</label>
                                    <input name="metadata.device_model.description" class="form-control form-control-sm" id="exampleFormControlInput7" placeholder="e.g: " 
                                         type="text" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="exampleFormControlInput8" class="form-label">Device model purchase date</label>
                                    <input name="metadata.device_model.purchased" class="form-control form-control-sm" id="exampleFormControlInput8" placeholder="e.g: 2020-09-18" 
                                         type="text" >
                                </div>
                                
                                <div class="mb-3">
                                    <label for="exampleFormControlInput9" class="form-label">Device pid (identifier to external reference)</label>
                                    <input name="metadata.device_model.pid" class="form-control form-control-sm" id="exampleFormControlInput9" placeholder="e.g: https://registry.o2a-data.de/items/4438" 
                                         type="text" >
                                </div>
                                
                                <div class="">
                                    <label for="" class="form-label">Device serial number(s)</label>
                                </div>
                                <!-- Container where inputs will be added -->
                                <!-- Button to trigger the append -->
                                <div id="container_serial">
                                </div>
                                <button  type="button" class="btn btn-sm btn-outline-dark mt-2"id="btn1"><i class="material-icons">add_box</i> Add serial number</button>
                                
                                
                                
                            </div>
                        </div>
                    </div>
                    <div class="col-3 p-1">
                        <div class="card">
                            <div class="card-header">
                                <b>Device owner</b>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="exampleFormControlInput10" class="form-label">Device owner name</label>
                                    <input name="metadata.owner.name" class="form-control form-control-sm" id="exampleFormControlInput10" placeholder="e.g: TROPOS" 
                                         type="text" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="exampleFormControlInput11" class="form-label">Device owner address</label>
                                    <input name="metadata.owner.address" class="form-control form-control-sm" id="exampleFormControlInput11" placeholder="e.g: Country, postal code, city etc" 
                                         type="text">
                                </div>
                                
                                <div class="mb-3">
                                    <label for="exampleFormControlInput13" class="form-label">Device owner contact</label>
                                    <input name="metadata.owner.contact" class="form-control form-control-sm" id="exampleFormControlInput13" placeholder="e.g: email, telefon number etc." 
                                         type="text" required>
                                </div>
                               
                                
                                <div class="">
                                    <label for="" class="form-label">Device owner inventory number(s)</label>
                                </div>
                                <!-- Container where inputs will be added -->
                                <!-- Button to trigger the append -->
                                <div id="container_inventory">
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-dark mt-2"id="btn2"> <i class="material-icons">add_box</i> Add inventory number</button>
                                
    
                                

                            </div>
                            
                        </div>
                        
                    </div>
                    <div class="col-12 p-1 text-end">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                    
                </div>
                </form>
                

            </div>
        </div>
        
    </div>
    
    
{% endblock %}

{% block javascript %}
<script>
    // append info to all form labels, if form elements are required
    // important: form elements must have an id:: id="exampleFormControlInput11"
    // important: label must have an for to the related form element id: for="exampleFormControlInput11"
    function addRequiredIconToRequiredLabels(formSelector) {
      // Determine the scope: specific form if selector provided, or entire document
      const scope = formSelector ? document.querySelector(formSelector) : document;
      
      if (!scope) return;

      // Select all required form controls: inputs, selects, textareas
      const requiredControls = scope.querySelectorAll('input[required], select[required], textarea[required]');

      requiredControls.forEach(control => {
        let label = null;

        // 1. If the control has an 'id', look for a label with matching 'for' attribute
        if (control.id) {
          label = scope.querySelector(`label[for="${control.id}"]`);
        } 
        // 2. For checkboxes/radios without an ID, look for a label that wraps the element
        else if ((control.type === 'checkbox' || control.type === 'radio')) {
          const closestLabel = control.closest('label');
          if (closestLabel) label = closestLabel;
        }

        // Proceed only if a label is found and it doesn't already contain the specific icon
        if (label && !label.querySelector('abbr')) {
          // Create the <abbr> element
          const abbr = document.createElement('abbr');
          abbr.title = 'Required form field!';
          abbr.textContent = ''; // No text content inside abbr, just the icon

          // Create the <i> element for the icon
          const icon = document.createElement('i');
          icon.className = 'material-icons';
          icon.textContent = 'sports_volleyball';

          // Append a space and the abbreviation to the label
          label.appendChild(document.createTextNode(' '));
          label.appendChild(abbr);
          abbr.appendChild(icon);
        }
      });
    }
    
    // Execute when the DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      // Option A: Run for the entire page
      addRequiredIconToRequiredLabels();

      // Option B: Run only for a specific form
      // addRequiredIconToRequiredLabels('#mySpecificForm');
    });
    

    // generate addition input forms, if button is clicked
    function createUniqueInputAppender(containerId, buttonId, inputType = 'text', nameBase = 'dynamicInput', nameBase2 = 'dynamicInput') {
      const container = document.getElementById(containerId);

      if (!container) {
        console.error(`Container with id "${containerId}" not found.`);
        return;
      }

      let count = 0;

      function addInput() {
        count++;
        const uniqueSuffix = count;

        // Wrapper div
        const wrapper = document.createElement('div');
        wrapper.classList.add('input-group');
        wrapper.classList.add('pt-1');

        // First input
        const input = document.createElement('input');
        input.type = inputType;
        input.name = `${nameBase}_${uniqueSuffix}`;
        input.id = `${nameBase}_${uniqueSuffix}`;
        input.classList.add('form-control');
        input.classList.add('form-control-sm');
        input.placeholder = `Key#${uniqueSuffix}?`;
        //input.style.marginBottom = '5px';

        // Second input
        const input2 = document.createElement('input');
        input2.type = inputType;
        input2.name = `${nameBase2}_${uniqueSuffix}`;
        input2.id = `${nameBase2}_${uniqueSuffix}`;
        input2.classList.add('form-control');
        input2.classList.add('form-control-sm');
        input2.placeholder = `ID#${uniqueSuffix}?`;
        input2.style.marginBottom = '1px';

        // Span
        const span = document.createElement('span');
        span.classList.add('input-group-text');
        span.style.padding = '0';
        span.textContent = '@';

        // Remove button
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.classList.add('btn');
        removeBtn.classList.add('btn-sm');
        removeBtn.classList.add('btn-danger');
        removeBtn.textContent = 'Remove';
        removeBtn.style.marginLeft = '5px';

        removeBtn.addEventListener('click', () => {
          wrapper.remove();
        });

        // Append into wrapper
        wrapper.appendChild(input);
        wrapper.appendChild(span);
        wrapper.appendChild(input2);
        wrapper.appendChild(removeBtn);

        // Append wrapper to container
        container.appendChild(wrapper);
      }

      if (buttonId) {
        const button = document.getElementById(buttonId);
        if (!button) {
          console.error(`Button with id "${buttonId}" not found.`);
          return;
        }
        button.addEventListener('click', addInput);
      }

      return addInput;
    }

    createUniqueInputAppender('container_serial', 'btn1', 'text', 'serial_key', 'serial_value');

    createUniqueInputAppender('container_inventory', 'btn2', 'text', 'inventory_key', 'inventory_value');
</script>
{% endblock %}
