{% extends 'base.html' %}
{% block content %}
<style>
/* Override Bootstrap's placeholder styles */

.form-select::placeholder,
textarea::placeholder,
input::placeholder {
  font-family: "Liberation Mono", monospace !important;
  font-size: 0.9em;
  color: blue !important;
  opacity: 0.4 !important;
}
</style>
    <div class="container">
        <div class="row py-3">
            <div class="col-12 borders srounded pt-3 mb-4">
                <h2>Add history</h2>

            </div>
            
            <div class="col-12 border  rounded p-3">
                <form method="get"     enctype = "multipart/form-data" action="{{ url_for('handle_add_history') }}">
                    
                    
                <div class="row">
                    <div class="col-3 p-1">
                        <div class="card">
                            <div class="card-header">
                                <b>General info</b>
                            </div>
                            <div class="card-body">

                                    <select name="device" class="form-select form-select-sm" aria-label="Small select example" required>
                                        <option value=""></option>
                                        {% for device in devices %}
                                            <option value="{{device}}">{{device}}</option>
                                        {% endfor %}
                                    </select>                                            
                                </div>
                        
                                <div class="mb-3">
                                    <label for="datetimepicker1" class="form-label">Start date</label>
                                    <input name="history.startdate" class="form-control form-control-sm" placeholder="e.g: 2022-01-28 14:22" 
                                        id="datetimepicker1" type="text" required>
                                </div>
                                
                                
                                <div class="mb-3">
                                    <label for="datetimepicker2" class="form-label">Stop date</label>
                                    <input name="history.stopdate" class="form-control form-control-sm" id="datetimepicker2" placeholder="e.g: 2099-12-31 23:59" 
                                        id="datetimepicker2" type="text" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="exampleFormControlInput3" class="form-label">Campaign acronym</label>
                                    <input name="history.campaign" class="form-control form-control-sm" id="exampleFormControlInput3" placeholder="e.g: PS127 | C3SAR" 
                                        type="text">
                                </div>
                                
                                <div class="mb-3">
                                    <label for="exampleFormControlInput4" class="form-label">Platform (hierarchical list, comma separated)</label>
                                    <input name="history.platform" class="form-control form-control-sm" id="exampleFormControlInput4" placeholder="e.g: Polarstern,OCEANET | TARO" 
                                        type="text">
                                </div>
                                
                            </div>
                        </div>
                        
                    </div>
                    <div class="col-6 p-1">
                        <div class="card">
                            <div class="card-header">
                                <div class="d-flex justify-content-between">
                                    <div class=""><b>Location</b></div>
                                    <div class="form-check form-switch" id="my_switch">
                                        <label class="form-check-label" for="switchCheckDefault">is mobile</label>
                                        <input name="history.location.is_mobile" class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
                                    </div>
                                </div>
                                
                                
                            </div>
                            <div class="card-body">
                                
                                
                                
                                <div class="row">
                                    <div class="col-5 p-1 mx-2" id="my_static_location">
                                        
                                        <div class="mb-3">
                                            <label for="exampleFormControlInput5" class="form-label">Location name</label>
                                            <select name="history.location.name" class="form-select form-select-sm" aria-label="Small select example" required>
                                                <option value=""></option>
                                                {% for location in locations %}

                                                {% endfor %}
                                            </select>                                            
                                        </div>
                                        
<!--
                                        <div class="mb-3">
                                            <label for="exampleFormControlInput6" class="form-label">Location description</label>
                                            <input name="history.location.description" class="form-control form-control-sm" id="exampleFormControlInput6" placeholder="e.g: Grerald et. al" 
                                                 type="text" >
                                        </div>
-->
                                    </div>
                                    
                                    <div class="col-6  p-1 ms-4" id="my_mobile_location">
                                        
                                        <div class="mb-3">
                                            <label for="exampleFormControlInput5" class="form-label">Mobile location name or label</label>
                                            <input name="history.location.name" class="form-control form-control-sm" id="exampleFormControlInput5" placeholder="e.g: Polarstern track PS127" 
                                                 type="text" required>
                                        </div>
                                        
<!--
                                        <div class="mb-3">
                                            <label for="exampleFormControlInput6" class="form-label">Mobile location description</label>
                                            <input name="history.location.description" class="form-control form-control-sm" id="exampleFormControlInput6" placeholder="e.g: Grerald et. al" 
                                                 type="text" required>
                                        </div>
-->
                                        
                                        <div class="mb-3">
                                            <label for="exampleFormControlInput7" class="form-label">Track url</label>
                                            <input name="history.location.track_url" class="form-control form-control-sm" id="exampleFormControlInput7" placeholder="e.g: " 
                                                 type="text" >
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="exampleFormControlInput5" class="form-label">Track description</label>
                                            <input name="history.location.track_desc" class="form-control form-control-sm" id="exampleFormControlInput5" placeholder="e.g: email, telefon, url"

                                        </div>
                                    </div>
                                    
                                </div>
                                
                                
                                
                            </div>
                        </div>                        
                    </div>
                    
                    <div class="col-3 p-1">
                        <div class="card">
                            <div class="card-header">
                                <b>Pylarda</b>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="exampleFormControlInput26" class="form-label">Camp</label>
                                    <input name="history.pylarda.camp" class="form-control form-control-sm" id="exampleFormControlInput26" placeholder="e.g: cv_oscm"

                                    <label for="exampleFormControlInput27" class="form-label">System</label>
                                    <input name="history.pylarda.system" class="form-control form-control-sm" id="exampleFormControlInput27" placeholder="e.g: ?"

                                </div>
                                
                                <div class="mb-3">
                                    <label for="exampleFormControlInput28" class="form-label">Connector file (comma separated)</label>
                                    <input name="history.pylarda.connectorfile" class="form-control form-control-sm" id="exampleFormControlInput28" placeholder="e.g: file1.json,file2.json"

                    <div class="col-12 p-1 text-end">

                    </div>
                    
                </div>
                </form>
                

            </div>
            
        
        </div>

{% block javascript %}

<link rel="stylesheet" href="{{ url_for('static', filename='lib/datetimepicker-master/jquery.datetimepicker.css') }}" />
<script src="{{ url_for('static', filename='lib/jquery-ui-1.14.2.custom/jquery-ui.min.js') }}"></script>
<script src="{{ url_for('static', filename='lib/datetimepicker-master/build/jquery.datetimepicker.full.min.js') }}"></script>

<script>
    
    $(document).ready(function() {
        $.datetimepicker.setLocale('en');
        $('#datetimepicker1').datetimepicker({
            format:'Y-m-d H:i',
            lang:'en'
        }
        );
    });
    $(document).ready(function() {
        $.datetimepicker.setLocale('en');
        $('#datetimepicker2').datetimepicker({
            format:'Y-m-d H:i',
            lang:'en'
        }
        );
    });
    
   

    // append info to all form labels, if form elements are required
    // important: form elements must have an id:: id="exampleFormControlInput11"
    // important: label must have an for to the related form element id: for="exampleFormControlInput11"
    function addRequiredIconToRequiredLabels(formSelector) {
      // Determine the scope: specific form if selector provided, or entire document
      const scope = formSelector ? document.querySelector(formSelector) : document;
      
      if (!scope) return;

      // Select all required form controls: inputs, selects, textareas
      const requiredControls = scope.querySelectorAll('input[required], select[required], textarea[required]');

      requiredControls.forEach(control => {
        let label = null;

        // 1. If the control has an 'id', look for a label with matching 'for' attribute
        if (control.id) {
          label = scope.querySelector(`label[for="${control.id}"]`);
        } 
        // 2. For checkboxes/radios without an ID, look for a label that wraps the element
        else if ((control.type === 'checkbox' || control.type === 'radio')) {
          const closestLabel = control.closest('label');
          if (closestLabel) label = closestLabel;
        }

        // Proceed only if a label is found and it doesn't already contain the specific icon
        if (label && !label.querySelector('abbr')) {
          // Create the <abbr> element
          const abbr = document.createElement('abbr');
          abbr.title = 'Required form field!';
          abbr.textContent = ''; // No text content inside abbr, just the icon

          // Create the <i> element for the icon
          const icon = document.createElement('i');
          icon.className = 'material-icons';
          icon.textContent = 'sports_volleyball';

          // Append a space and the abbreviation to the label
          label.appendChild(document.createTextNode(' '));
          label.appendChild(abbr);
          abbr.appendChild(icon);
        }
      });
    }
    
    // Execute when the DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      // Option A: Run for the entire page
      addRequiredIconToRequiredLabels();

      // Option B: Run only for a specific form
      // addRequiredIconToRequiredLabels('#mySpecificForm');
    });
    

    
    
    /**
     * Initializes the form toggler logic.
     * Accepts numeric IDs and handles CSS escaping automatically.
     */
    function initFormToggler(idDiv1, idDiv2, idDiv3) {
      // Get container elements
      const div1 = document.getElementById(idDiv1);
      const div2 = document.getElementById(idDiv2);

      if (!div1 || !div2) {
        console.error(`Error: Could not find divs with IDs "${idDiv1}" or "${idDiv2}"`);
        return;
      }

      // Helper to get all interactive form controls
      const getFormControls = (container) => {
        return container.querySelectorAll('input, select, textarea, button');
      };

      // The core logic function
      const toggleMode = (isChecked) => {
        const controls1 = getFormControls(div1);
        const controls2 = getFormControls(div2);

        if (isChecked) {
          // Checkbox is Checked: Disable Form 1, Enable Form 2
          controls1.forEach(el => el.disabled = true);
          controls2.forEach(el => el.disabled = false);
        } else {
          // Checkbox is Unchecked: Enable Form 1, Disable Form 2
          controls1.forEach(el => el.disabled = false);
          controls2.forEach(el => el.disabled = true);
        }
      };

      // --- CSS ESCAPE FOR NUMERIC ID "3" ---
      // '3' in hex is '33'. Selector becomes "#\33 "
      const escapedId = idDiv3.replace(/^([0-9a-fA-F])/, (match) => {
          return '\\' + match.charCodeAt(0).toString(16) + ' ';
      });
      
      const selector = `#${escapedId} input[type="checkbox"]`;
      const checkbox = document.querySelector(selector);

      if (!checkbox) {
        console.warn(`Warning: No checkbox found for selector "${selector}"`);
        return;
      }

      // Attach event listener
      checkbox.addEventListener('change', (event) => {
        toggleMode(event.target.checked);
      });

      // Set initial state immediately based on current checkbox state
      toggleMode(checkbox.checked);
    }

    // Initialize when the page is ready
    document.addEventListener('DOMContentLoaded', () => {
      // Pass your specific IDs: "1", "2", "3"
      initFormToggler('my_static_location', 'my_mobile_location', 'my_switch');
    });
</script>
{% endblock %}
